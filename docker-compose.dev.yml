version: "3.9"

services:

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - talktor-db:/var/lib/postgresql/data
    networks:
      - talktor-net

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_SERVER_DEFAULT_CONNECT_TIMEOUT: 10
      PGADMIN_SERVER_DEFAULT_SSL_MODE: prefer
      PGADMIN_SERVER_JSON_1_NAME: "Talktor DB"
      PGADMIN_SERVER_JSON_1_GROUP: "Servers"
      PGADMIN_SERVER_JSON_1_HOST: "host.docker.internal"
      PGADMIN_SERVER_JSON_1_PORT: 5432
      PGADMIN_SERVER_JSON_1_MAINTENANCE_DB: ${POSTGRES_DB}
      PGADMIN_SERVER_JSON_1_USERNAME: ${POSTGRES_USER}
      PGADMIN_SERVER_JSON_1_PASSWORD: ${POSTGRES_PASSWORD}
      PGADMIN_SERVER_JSON_1_SSL_MODE: "prefer"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - talktor-net

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "ls node_modules/.bin/next >/dev/null 2>&1 || npm ci; npm run dev -- --hostname 0.0.0.0"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - talktor-frontend-node_modules:/app/node_modules
    networks:
      - talktor-net
    profiles:
      - frontend

volumes:
  talktor-db:
  pgadmin-data:
  talktor-frontend-node_modules:

networks:
  talktor-net:
