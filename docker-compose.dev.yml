version: "3.9"

services:

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - talktor-db:/var/lib/postgresql/data
    networks:
      - talktor-net

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_SERVER_DEFAULT_CONNECT_TIMEOUT: 10
      PGADMIN_SERVER_DEFAULT_SSL_MODE: prefer
      PGADMIN_SERVER_JSON_1_NAME: "Talktor DB"
      PGADMIN_SERVER_JSON_1_GROUP: "Servers"
      PGADMIN_SERVER_JSON_1_HOST: "host.docker.internal"
      PGADMIN_SERVER_JSON_1_PORT: 5432
      PGADMIN_SERVER_JSON_1_MAINTENANCE_DB: ${POSTGRES_DB}
      PGADMIN_SERVER_JSON_1_USERNAME: ${POSTGRES_USER}
      PGADMIN_SERVER_JSON_1_PASSWORD: ${POSTGRES_PASSWORD}
      PGADMIN_SERVER_JSON_1_SSL_MODE: "prefer"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - talktor-net

volumes:
  talktor-db:
  pgadmin-data:

networks:
  talktor-net:
